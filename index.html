<!DOCTYPE html>
<html>
<head>
    <title>Simple Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #222;
            padding: 15px;
        }

        nav h2 {
            color: white;
            display: inline;
            margin-right: 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: #00bfff;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
